name: Uppdatera Riksbankens valutakurser

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Hämta kurser
        run: python _src/k4/fetch_rates.py
      - name: Spara om något ändrats
        run: |
          if git diff --quiet -- k4/rates.json && git ls-files --error-unmatch k4/rates.json >/dev/null 2>&1; then
            echo "Inga ändringar"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898729+github-actions[bot]@users.noreply.github.com"
          git add k4/rates.json
          git commit -m "Uppdatera Riksbankens valutakurser"
          git push
